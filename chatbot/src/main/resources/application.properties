spring.application.name=chatbot
chatbot.session-timeout=15m
chatbot.cleanup-interval=60000
chatbot.max-messages=1000
chatbot.max-message-length=4096

.\mvnw.cmd -pl chatbot spring-boot:run# Swagger UI for laboratory 3
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.override-with-generic-response=false
